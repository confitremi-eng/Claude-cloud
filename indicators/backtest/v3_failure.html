  options:{ plugins:{ legend:{display:false} }, scales:{ x:{ ticks:{ maxTicksLimit:10 } }, y:{ title:{display:true, text:'R'} } } },
  plugins:[{ id:'shade', beforeDraw(c){ const x=c.scales.x, a=c.chartArea; const x0=x.getPixelForValue(isStart);
    c.ctx.save(); c.ctx.fillStyle='rgba(128,128,128,0.12)'; c.ctx.fillRect(x0, a.top, a.right-x0, a.bottom-a.top); c.ctx.restore(); } }] });
const col = { '目標':'#3aa76d', '停損':css('--oos'), '時間 / 休市':css('--amber') };
new Chart(exit, { type:'bar', data:{ labels:D.years, datasets:Object.keys(D.exit).map(k => ({ label:k, data:D.exit[k], backgroundColor:col[k] })) },
  options:{ scales:{ x:{stacked:true}, y:{stacked:true, max:100} } } });
new Chart(mfe, { type:'bar', data:{ labels:D.mfe_bins, datasets:[{ label:'樣本外', data:D.mfe.OOS, backgroundColor:css('--oos') }, { label:'v3 那年', data:D.mfe.IS, backgroundColor:css('--is') }] } });
new Chart(kind, { type:'bar', data:{ labels:D.years, datasets:[{ label:'趨勢訊號', data:D.kind['趨勢'], backgroundColor:css('--oos') }, { label:'MIX 突破', data:D.kind['MIX'], backgroundColor:css('--amber') }] } });
new Chart(hour, { type:'line', data:{ labels:D.hours, datasets:[{ label:'樣本外', data:D.hourR.OOS, borderColor:css('--oos'), spanGaps:false }, { label:'v3 那年', data:D.hourR.IS, borderColor:css('--is') }] },
  options:{ scales:{ y:{ title:{display:true, text:'每筆 R'} } } } });
</script>
