<title>GEX 午夜時段</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* Layout: one review column — summary strip, the day's chart, then the trade log that drives the chart */
:root {
  --bg: #f3f4f6; --panel: #ffffff; --ink: #1b1f27; --muted: #626a78; --line: #dde1e7;
  --chart-bg: #f4f4f4; --grid: #e6e7ea; --candle-up: #ffffff; --candle-dn: #d9534f; --wick: #1b1f27;
  --flip: #b13dd6; --fast: #c94fe0; --slow: #3b6cf0; --buy: #1f8a52; --sell: #c8423d; --other: #8b93a1;
  --sel: #eef0fb; --stop: #e05050; --tgt: #2e9d5b;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121419; --panel: #1b1e25; --ink: #e8eaee; --muted: #9aa1ad; --line: #2c3039;
  --chart-bg: #171a20; --grid: #242831; --candle-up: #e8eaee; --candle-dn: #e0605b; --wick: #c9ced6;
  --flip: #d27cf0; --fast: #d98bf0; --slow: #7a9cff; --buy: #4cc285; --sell: #ef6c66; --other: #7c8494;
  --sel: #252a3a; --stop: #ef6c66; --tgt: #4cc285; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121419; --panel: #1b1e25; --ink: #e8eaee; --muted: #9aa1ad; --line: #2c3039;
  --chart-bg: #171a20; --grid: #242831; --candle-up: #e8eaee; --candle-dn: #e0605b; --wick: #c9ced6;
  --flip: #d27cf0; --fast: #d98bf0; --slow: #7a9cff; --buy: #4cc285; --sell: #ef6c66; --other: #7c8494;
  --sel: #252a3a; --stop: #ef6c66; --tgt: #4cc285; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--sans); }
main { max-width: 1120px; margin: 0 auto; padding-block: 20px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.cell { background: var(--panel); padding: 10px 14px; min-width: 0; }
.cell .k { font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.cell .v { font: 600 22px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.cell .n { font-size: 12px; color: var(--muted); }
.pos { color: var(--buy); } .neg { color: var(--sell); }
.board { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.bar .day { font: 600 15px var(--mono); }
.bar .meta { color: var(--muted); font-size: 13px; min-width: 0; }
.bar .nav { margin-left: auto; display: flex; gap: 6px; }
button { font: 500 13px var(--sans); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 5px 11px; cursor: pointer; }
button:hover { border-color: var(--muted); }
button:focus-visible, tr:focus-visible { outline: 2px solid var(--flip); outline-offset: 2px; }
#chart { height: 440px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 9px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.sw { display: inline-block; width: 18px; height: 0; border-top: 2px dashed; vertical-align: middle; margin-right: 6px; }
.log { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12px; }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
th.num { text-align: right; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--sel); }
tbody tr.on { background: var(--sel); box-shadow: inset 3px 0 0 var(--flip); }
.side { font-weight: 700; }
.note { color: var(--muted); font-size: 13px; max-width: 70ch; margin: 0; }
@media (max-width: 560px) { #chart { height: 360px; } .cell .v { font-size: 19px; } }
</style>

<main>
  <header>
    <h1>GEX setup：台北 00:00–01:05 的 16 筆</h1>
    <p class="sub" id="sub"></p>
  </header>
  <section class="strip" id="strip"></section>
  <section class="board">
    <div class="bar">
      <span class="day" id="day"></span><span class="meta" id="meta"></span>
      <span class="nav"><button id="prev" type="button">上一筆</button><button id="next" type="button">下一筆</button></span>
    </div>
    <div id="chart"></div>
    <div class="legend">
      <span><i class="sw" style="border-color:var(--flip)"></i>QQQ flip（換成 NQ 點數）</span>
      <span><i class="sw" style="border-color:var(--fast)"></i>5 秒 EMA1130</span>
      <span><i class="sw" style="border-color:var(--slow)"></i>15 秒 EMA1130</span>
      <span>紅線停損、綠線目標；灰色記號 = 當天其他時間的 GEX setup</span>
    </div>
  </section>
  <section class="board log">
    <table>
      <thead><tr><th>台北時間</th><th>方向</th><th class="num">進場</th><th class="num">停損</th><th class="num">風險</th><th class="num">離 flip</th><th>出場</th><th class="num">R</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>
  <p class="note" id="note"></p>
</main>

<script>
const DATA = /*DATA*/null;
const S = DATA.summary;
const trades = [];
DATA.days.forEach((d, di) => d.trades.forEach(t => { if (t.lunch) trades.push({ ...t, di }); }));
const sgn = v => (v > 0 ? '+' : '') + v.toFixed(2);
const cls = v => v > 0 ? 'pos' : 'neg';
const buys = trades.filter(t => t.side === 1), sells = trades.filter(t => t.side === -1);
const avg = a => a.reduce((s, t) => s + t.net, 0) / a.length;

document.getElementById('sub').textContent = `NQ RTH 1 分 K，(35, 0, 8, 1) + Trend Judge 順勢 + 朝 QQQ flip 走，${S.start} 到 ${S.end}（美東日期），每筆單獨算：兩根 K 停損、3R、60 根或 16:00 出場、扣 1 點`;
document.getElementById('strip').innerHTML = [
  ['筆數', S.n, `其他時間 ${S.on} 筆`],
  ['3R 勝率', S.win + '%', `其他時間 ${S.owin}%`],
  ['合計', (S.tot > 0 ? '+' : '') + S.tot + 'R', ''],
  ['每筆', sgn(S.per) + 'R', `其他時間 ${sgn(S.oper)}R`],
  ['買單', buys.length + ' 筆', `每筆 ${sgn(avg(buys))}R`],
  ['賣單', sells.length + ' 筆', `每筆 ${sgn(avg(sells))}R`],
].map(([k, v, n]) => `<div class="cell"><div class="k">${k}</div><div class="v ${/R$/.test(String(v)) ? cls(parseFloat(v)) : ''}">${v}</div><div class="n">${n}</div></div>`).join('');
document.getElementById('note').textContent = `賣單 ${sells.length} 筆有 ${sells.filter(t => t.net > 0).length} 筆到目標；買單 ${buys.length} 筆只有 ${buys.filter(t => t.net > 0).length} 筆賺錢，美東 9/17 和 10/19 都是同一天連虧三筆。只有 ${trades.length} 筆，買賣的差別可能只是這幾天的行情。`;

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  autoSize: true, timeScale: { timeVisible: true, secondsVisible: false }, crosshair: { mode: 0 },
  localization: { timeFormatter: s => new Date(s * 1000).toISOString().slice(11, 16) } });
const candles = chart.addCandlestickSeries({ priceLineVisible: false });
const line = (w, st) => chart.addLineSeries({ lineWidth: w, lineStyle: st, priceLineVisible: false, lastValueVisible: false, crosshairMarkerVisible: false });
const flip = line(2, 2), fast = line(2, 1), slow = line(2, 1);
let segs = [], cur = 0, shownDay = -1;
function paint() {
  chart.applyOptions({ layout: { background: { color: css('--chart-bg') }, textColor: css('--muted'), fontFamily: css('--mono') },
    grid: { vertLines: { color: css('--grid') }, horzLines: { color: css('--grid') } },
    rightPriceScale: { borderColor: css('--line') }, timeScale: { borderColor: css('--line') } });
  candles.applyOptions({ upColor: css('--candle-up'), downColor: css('--candle-dn'), borderUpColor: css('--wick'), borderDownColor: css('--wick'), wickUpColor: css('--wick'), wickDownColor: css('--wick') });
  flip.applyOptions({ color: css('--flip') }); fast.applyOptions({ color: css('--fast') }); slow.applyOptions({ color: css('--slow') });
  if (shownDay >= 0) drawDay(shownDay, true);
}
function drawDay(di, force) {
  if (di === shownDay && !force) return;
  shownDay = di; const d = DATA.days[di];
  candles.setData(d.bars.map(b => ({ time: b[0], open: b[1], high: b[2], low: b[3], close: b[4] })));
  fast.setData(d.bars.filter(b => b[5] !== null).map(b => ({ time: b[0], value: b[5] })));
  slow.setData(d.bars.filter(b => b[6] !== null).map(b => ({ time: b[0], value: b[6] })));
  flip.setData(d.bars.filter(b => b[7] !== null).map(b => ({ time: b[0], value: b[7] })));
  segs.forEach(s => chart.removeSeries(s)); segs = [];
  const marks = [];
  d.trades.forEach(t => {
    const col = !t.lunch ? css('--other') : t.side === 1 ? css('--buy') : css('--sell');
    marks.push({ time: t.t0, position: t.side === 1 ? 'belowBar' : 'aboveBar', color: col, shape: t.side === 1 ? 'arrowUp' : 'arrowDown', text: t.lunch ? (t.side === 1 ? '買 ' : '賣 ') + sgn(t.net) + 'R' : '' });
    if (!t.lunch) return;
    const seg = (p, c) => { const s = line(1, 0); s.applyOptions({ color: c }); s.setData(t.t1 > t.t0 ? [{ time: t.t0, value: p }, { time: t.t1, value: p }] : [{ time: t.t0, value: p }]); segs.push(s); };
    seg(t.stop, css('--stop')); seg(t.tgt, css('--tgt'));
  });
  marks.sort((a, b) => a.time - b.time); candles.setMarkers(marks);
}
function show(k) {
  cur = (k + trades.length) % trades.length; const t = trades[cur], d = DATA.days[t.di];
  drawDay(t.di);
  chart.timeScale().setVisibleRange({ from: t.t0 - 75 * 60, to: t.t1 + 50 * 60 });
  document.getElementById('day').textContent = t.tw;
  document.getElementById('meta').textContent = `美東 ${d.day}｜當天 NQ ${d.move > 0 ? '+' : ''}${d.move} 點｜第 ${cur + 1} / ${trades.length} 筆`;
  document.querySelectorAll('#rows tr').forEach((r, i) => r.classList.toggle('on', i === cur));
}
document.getElementById('rows').innerHTML = trades.map((t, i) => `<tr tabindex="0" data-i="${i}">
  <td>${t.tw}</td><td class="side ${t.side === 1 ? 'pos' : 'neg'}">${t.side === 1 ? '買' : '賣'}</td>
  <td class="num">${t.entry.toFixed(2)}</td><td class="num">${t.stop.toFixed(2)}</td><td class="num">${t.risk.toFixed(1)}</td>
  <td class="num">${t.flipd.toFixed(2)}%</td><td>${t.exit} ${t.twx}</td><td class="num ${cls(t.net)}">${sgn(t.net)}</td></tr>`).join('');
document.querySelectorAll('#rows tr').forEach(r => {
  r.addEventListener('click', () => show(+r.dataset.i));
  r.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); show(+r.dataset.i); } });
});
document.getElementById('prev').onclick = () => show(cur - 1);
document.getElementById('next').onclick = () => show(cur + 1);
paint(); show(0);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', paint);
new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
</script>
